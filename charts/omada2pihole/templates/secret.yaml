{{- include "omada2pihole.validate" . }}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omada2pihole.fullname" . }}
  labels:
    {{- include "omada2pihole.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMADA_CLIENT_ID: {{ .Values.credentials.omadaClientId | quote }}
  OMADA_CLIENT_SECRET: {{ .Values.credentials.omadaClientSecret | quote }}
  PIHOLE_PASSWORD: {{ .Values.credentials.piholePassword | quote }}
{{- end }}
